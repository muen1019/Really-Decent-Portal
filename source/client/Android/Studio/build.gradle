// SPDX-License-Identifier: Apache-2.0
// Modified for DeskQuay distribution and source-native rebuild, 2026-10-29.
buildscript {
    repositories { mavenCentral(); google() }
    dependencies { classpath 'com.android.tools.build:gradle:9.2.1' }
}
// Version is independent of a local Git tag or signing key.
ext {
    compileApi = 37
    targetApi = 37
    minApi = 29
    toolsVersion = '37.0.0'
    ndkVersion = '29.0.13113456'
    cmakeVersion = '4.1.2'
    versionName = '0.1.0-preview.1'
    versionCode = 1
    def selectedAbi = providers.gradleProperty('deskquayAbi').getOrElse('arm64-v8a')
    if (!(selectedAbi in ['arm64-v8a', 'x86_64'])) {
        throw new GradleException('This reviewed build supports one ARM64 or x86_64 ABI.')
    }
    abiFilters = [selectedAbi] as String[]
    splitArchs = [selectedAbi] as String[]
    splitEnabled = false
    universal = false
    // Matches the input-tested native feature set; optional codecs remain disabled.
    cmakeArguments = ['-DWITH_FFMPEG=OFF', '-DWITH_OPENH264=OFF', '-DWITH_OPUS=OFF',
        '-DWITH_WEBP=OFF', '-DWITH_JPEG=OFF', '-DWITH_PNG=OFF',
        '-DWITH_CJSON=ON', '-DWITH_OPENSSL=ON', '-DCMAKE_EXPORT_COMPILE_COMMANDS=ON']
    ['deskquayMsysRoot':'FREERDP_MSYS_ROOT', 'deskquayMake':'FREERDP_MSYS_MAKE',
     'deskquayPkgConfig':'PKG_CONFIG_EXECUTABLE',
     'deskquayCFlags':'CMAKE_C_FLAGS:STRING', 'deskquayCxxFlags':'CMAKE_CXX_FLAGS:STRING'].each { propertyName, cmakeName ->
        if (providers.gradleProperty(propertyName).isPresent()) {
            cmakeArguments += '-D' + cmakeName + '=' + providers.gradleProperty(propertyName).get()
        }
    }
    cmakeArguments = cmakeArguments as String[]
}
allprojects {
    repositories { mavenCentral(); google() }
    subprojects {
        afterEvaluate { project ->
            if (project.hasProperty('android')) {
                project.android {
                    if (namespace == null) { namespace 'com.freerdp.' + project.name.toLowerCase() }
                }
            }
        }
    }
}
